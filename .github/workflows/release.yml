name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0, used directly as Release Title)"
        required: true
        default: "0.2.0"
        type: string
      notes:
        description: "Additional release notes (write in English)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      platforms:
        description: "Target platforms: all, windows, macos, linux"
        required: false
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute target matrix
        id: set-matrix
        shell: bash
        run: |
          P="${{ inputs.platforms }}"
          if [ "$P" = "windows" ]; then
            echo 'matrix={"include":[{"platform":"windows-latest","args":""}]}' >> "$GITHUB_OUTPUT"
          elif [ "$P" = "macos" ]; then
            echo 'matrix={"include":[{"platform":"macos-latest","args":"--target universal-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$P" = "linux" ]; then
            echo 'matrix={"include":[{"platform":"ubuntu-22.04","args":""}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"platform":"windows-latest","args":""},{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","args":""}]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update release before parallel uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v$INPUT_VERSION"
          TITLE="$INPUT_VERSION"
          BODY_FILE="$RUNNER_TEMP/release-body.md"
          cat > "$BODY_FILE" <<'RELEASE_BODY'
          ## AI Proxy Desktop

          Cross-platform Tauri app and Node.js CLI exposing local **Anthropic Messages API** and **OpenAI Chat / Responses API** gateways on top of local AI CLIs (Devin, Antigravity, OpenCode, Grok, Codex, Copilot, Cursor, Cline, Mistral, Kimi, Hermes, and custom ACP agents).

          ### Included
          - Dual gateway: Anthropic (`/v1/messages`, `/v1/models`) and OpenAI/Codex (`/v1/chat/completions`, `/v1/responses`, `/v1/models`)
          - Built-in authentication, Antigravity multi-account support, and live limits/quota inspection
          - Automatic installation of missing CLI runtimes, SQLite-backed playground chats, detailed logs, and token/cost tracking
          - Built-in update checks and installation from GitHub Releases
          - Installers: Windows (`.exe` NSIS / `.msi`), macOS (Universal `.dmg`), Linux (`.AppImage` / `.deb`)
          RELEASE_BODY
          if [ -n "$INPUT_NOTES" ]; then
            printf '\n%s\n' "$INPUT_NOTES" >> "$BODY_FILE"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$BODY_FILE"
          else
            PRERELEASE_FLAG=""
            if [ "$INPUT_PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" --title "$TITLE" --notes-file "$BODY_FILE" --target "${{ github.sha }}" $PRERELEASE_FLAG
          fi

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create-release.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      - name: Sync version into manifests
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            for (const p of ["desktop/package.json", "desktop/src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = ver;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            const cargoPath = "desktop/src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(/^version = ".*"$/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargo);
            const instCargoPath = "desktop/installer/Cargo.toml";
            if (fs.existsSync(instCargoPath)) {
              const instCargo = fs.readFileSync(instCargoPath, "utf8").replace(/^version = ".*"$/m, `version = "${ver}"`);
              fs.writeFileSync(instCargoPath, instCargo);
            }
          ' "$VER"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and upload custom Windows Setup
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ inputs.version }}"
          Push-Location desktop
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsisExe) { throw "NSIS setup executable not found" }
          $env:AI_PROXY_INNER_SETUP_PATH = $nsisExe.FullName
          $env:AI_PROXY_VERSION = $ver
          cargo build --release --manifest-path installer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $outExe = Join-Path (Get-Location) "AI-Proxy-Setup-$ver-x64.exe"
          Copy-Item "installer/target/release/ai-proxy-setup.exe" $outExe -Force
          Pop-Location
          gh release upload "v$ver" $outExe --clobber

      - name: Build and upload Tauri bundles (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v${{ inputs.version }}
          releaseName: ${{ inputs.version }}
          releaseBody: |
            ## AI Proxy Desktop

            Cross-platform Tauri app exposing local **Anthropic Messages API** and **OpenAI Chat / Responses API** gateways on top of local AI CLIs (Devin, Antigravity, OpenCode, Grok, Codex, Copilot, Cursor, Cline, Mistral, Kimi, Hermes, and custom ACP agents).

            ### Included
            - Dual gateway: Anthropic (`/v1/messages`, `/v1/models`) and OpenAI/Codex (`/v1/chat/completions`, `/v1/responses`, `/v1/models`)
            - Built-in authentication, Antigravity multi-account support, and live limits/quota inspection
            - Automatic installation of missing CLI runtimes, local SQLite playground chats, detailed logs, and token/cost tracking
            - Installers: Windows (`.exe` NSIS / `.msi`), macOS (Universal `.dmg`), Linux (`.AppImage` / `.deb`)

            ${{ inputs.notes }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}

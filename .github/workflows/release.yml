name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0, used directly as Release Title)"
        required: true
        default: "0.2.0"
        type: string
      notes:
        description: "Additional release notes"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      platforms:
        description: "Target platforms: all, windows, macos, linux"
        required: false
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute target matrix
        id: set-matrix
        shell: bash
        run: |
          P="${{ inputs.platforms }}"
          if [ "$P" = "windows" ]; then
            echo 'matrix={"include":[{"platform":"windows-latest","args":""}]}' >> "$GITHUB_OUTPUT"
          elif [ "$P" = "macos" ]; then
            echo 'matrix={"include":[{"platform":"macos-latest","args":"--target universal-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          elif [ "$P" = "linux" ]; then
            echo 'matrix={"include":[{"platform":"ubuntu-22.04","args":""}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"platform":"windows-latest","args":""},{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","args":""}]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update release before parallel uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          TITLE="${{ inputs.version }}"
          BODY="## AI Proxy Desktop

          Кроссплатформенное приложение (Tauri) и Node.js CLI с локальными шлюзами **Anthropic Messages API** и **OpenAI Chat / Responses API** поверх локальных AI CLI (Devin, Antigravity, OpenCode, Grok, Codex, Copilot, Cursor, Cline, Mistral, Kimi, Hermes и Custom ACP).

          ### Что включено
          - Двойной шлюз: Anthropic (\`/v1/messages\`, \`/v1/models\`) и OpenAI/Codex (\`/v1/chat/completions\`, \`/v1/responses\`, \`/v1/models\`)
          - Встроенная авторизация, мультиаккаунтность Antigravity и просмотр лимитов/квот
          - Автозагрузка недостающих CLI, SQLite тест-чат, логи и учёт токенов/трат
          - Встроенная проверка и установка обновлений из GitHub Releases
          - Установщики: Windows (\`.exe\` NSIS / \`.msi\`), macOS (\`.dmg\` Universal), Linux (\`.AppImage\` / \`.deb\`)

          ${{ inputs.notes }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
          else
            PRERELEASE_FLAG=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" --title "$TITLE" --notes "$BODY" --target "${{ github.sha }}" $PRERELEASE_FLAG
          fi

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.create-release.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      - name: Sync version into manifests
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            for (const p of ["desktop/package.json", "desktop/src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = ver;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            const cargoPath = "desktop/src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8").replace(/^version = ".*"$/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargo);
          ' "$VER"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v${{ inputs.version }}
          releaseName: ${{ inputs.version }}
          releaseBody: |
            ## AI Proxy Desktop

            Кроссплатформенное Tauri-приложение с локальными шлюзами **Anthropic Messages API** и **OpenAI Chat / Responses API** поверх локальных AI CLI (Devin, Antigravity, OpenCode, Grok, Codex, Copilot, Cursor, Cline, Mistral, Kimi, Hermes и Custom ACP).

            ### Что включено
            - Двойной шлюз: Anthropic (`/v1/messages`, `/v1/models`) и OpenAI/Codex (`/v1/chat/completions`, `/v1/responses`, `/v1/models`)
            - Встроенная авторизация, мультиаккаунтность Antigravity и просмотр живых лимитов/квот
            - Автозагрузка недостающих CLI движков, локальная SQLite БД тест-чатов, подробные логи и учёт токенов/трат
            - Установщики: Windows (`.exe` NSIS / `.msi`), macOS (`.dmg` Universal), Linux (`.AppImage` / `.deb`)

            ${{ inputs.notes }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
